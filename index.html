<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>爆款选题排行榜 · 全网热点选题雷达</title>
<style>
  :root{
    --bg:#0c0e14; --bg2:#11141d; --card:#161a25; --card2:#1c2130;
    --line:#262c3a; --txt:#e8ebf2; --sub:#9aa3b5; --dim:#6b7385;
    --accent:#ff5a36; --accent2:#ffb020; --good:#3ad29f; --bad:#ff6b6b;
    --radius:16px; --shadow:0 8px 30px rgba(0,0,0,.35);
    font-synthesis:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:
      radial-gradient(1200px 600px at 80% -10%, rgba(255,90,54,.10), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(0,179,255,.08), transparent 55%),
      var(--bg);
    color:var(--txt); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",
      "Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; line-height:1.5;}
  .wrap{max-width:1040px;margin:0 auto;padding:28px 18px 80px;}

  /* Header */
  header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:14px}
  .logo{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-size:26px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:var(--shadow)}
  .brand h1{font-size:25px;letter-spacing:.5px;font-weight:800}
  .brand p{color:var(--sub);font-size:13px;margin-top:3px}
  .snap{font-size:12px;color:var(--dim);text-align:right;line-height:1.7}
  .snap b{color:var(--sub)}

  /* Stats */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .stat{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);
    border-radius:14px;padding:16px 16px}
  .stat .n{font-size:26px;font-weight:800;letter-spacing:.5px}
  .stat .l{font-size:12px;color:var(--sub);margin-top:4px}
  .stat .n .u{font-size:14px;color:var(--dim);font-weight:600;margin-left:2px}

  /* Controls */
  .controls{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px;margin-bottom:18px;box-shadow:var(--shadow)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .chip{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card2);
    color:var(--sub);font-size:13px;cursor:pointer;user-select:none;transition:.15s;font-weight:600}
  .chip:hover{border-color:var(--accent);color:var(--txt)}
  .chip.on{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
  .row2{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--bg2);
    border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .search input{flex:1;background:none;border:none;outline:none;color:var(--txt);font-size:14px}
  .search input::placeholder{color:var(--dim)}
  select{background:var(--bg2);border:1px solid var(--line);color:var(--txt);border-radius:10px;
    padding:9px 12px;font-size:13px;outline:none;cursor:pointer}
  select option{background:var(--card)}

  /* List */
  .list{display:flex;flex-direction:column;gap:10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
    transition:.18s;cursor:pointer}
  .item:hover{border-color:#39415a;transform:translateY(-1px)}
  .item.open{border-color:var(--accent)}
  .top{display:flex;align-items:center;gap:14px;padding:14px 16px}
  .rank{width:34px;height:34px;flex:0 0 34px;border-radius:10px;display:grid;place-items:center;
    font-weight:800;font-size:15px;background:var(--card2);color:var(--sub);border:1px solid var(--line)}
  .rank.g1{background:linear-gradient(135deg,#ffd54a,#ff9d00);color:#3a2600;border:none}
  .rank.g2{background:linear-gradient(135deg,#d8e0ee,#9fb0c8);color:#1c2433;border:none}
  .rank.g3{background:linear-gradient(135deg,#ff9d6b,#c9703f);color:#2a1400;border:none}
  .main{flex:1;min-width:0}
  .ttl{font-size:15.5px;font-weight:700;line-height:1.4;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:7px}
  .badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px;color:#fff;letter-spacing:.3px}
  .ctag{font-size:11.5px;padding:3px 9px;border-radius:7px;font-weight:600;background:var(--card2);border:1px solid var(--line)}
  .trend{font-size:11px;font-weight:800;padding:3px 8px;border-radius:7px}
  .trend.hot{background:rgba(255,90,54,.16);color:#ff8a6a}
  .trend.rising{background:rgba(58,210,159,.16);color:#4fe0b0}
  .trend.new{background:rgba(0,179,255,.16);color:#5cc8ff}
  .right{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto}
  .heat{font-size:14px;font-weight:800;color:var(--accent2)}
  .heat .ic{margin-right:3px}
  .grow{font-size:12px;font-weight:700}
  .grow.up{color:var(--good)} .grow.down{color:var(--bad)}
  .arrow{transition:.2s;color:var(--dim);font-size:13px;margin-left:4px}
  .item.open .arrow{transform:rotate(180deg);color:var(--accent)}

  /* Detail */
  .detail{max-height:0;overflow:hidden;transition:max-height .25s ease;background:var(--bg2);
    border-top:1px solid transparent}
  .item.open .detail{max-height:240px;border-top-color:var(--line)}
  .detail-in{padding:14px 16px 16px}
  .dl{font-size:12px;color:var(--dim);margin-bottom:5px;font-weight:700;letter-spacing:.5px}
  .angle{font-size:14.5px;color:var(--txt);font-weight:600;line-height:1.6}
  .copy{margin-top:12px;display:inline-flex;align-items:center;gap:6px;background:var(--card2);
    border:1px solid var(--line);color:var(--txt);font-size:13px;font-weight:600;padding:8px 14px;
    border-radius:9px;cursor:pointer;transition:.15s}
  .copy:hover{border-color:var(--accent);color:#fff}
  .copy.done{background:var(--good);border-color:var(--good);color:#04241a}

  .empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px}
  footer{margin-top:34px;text-align:center;color:var(--dim);font-size:12px;line-height:1.9}
  footer b{color:var(--sub)}

  @media (max-width:680px){
    .stats{grid-template-columns:repeat(2,1fr)}
    .brand h1{font-size:21px}
    .snap{display:none}
    .right .heat{font-size:13px}
    .ttl{font-size:14.5px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo">🔥</div>
      <div>
        <h1>爆款选题排行榜</h1>
        <p>全网热点 × 自媒体选题灵感雷达</p>
      </div>
    </div>
    <div class="snap">
      数据快照 · <b>2026-09-19</b><br/>
      来源：抖音/微博/百度/微信/知乎公开热榜 + 小红书千瓜报告<br/>
      <span style="color:var(--dim)">数据可一键替换为你的实时源</span>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <section class="controls">
    <div class="chips" id="platformChips"></div>
    <div class="row2">
      <label class="search">
        <span style="color:var(--dim)">🔍</span>
        <input id="search" type="text" placeholder="搜索选题 / 角度关键词…" />
      </label>
      <select id="catFilter"><option value="">全部分类</option></select>
      <select id="sortBy">
        <option value="score">综合热度</option>
        <option value="growth">上升最快</option>
        <option value="heat">平台热度</option>
      </select>
    </div>
  </section>

  <section class="list" id="list"></section>

  <footer>
    <b>爆款选题排行榜</b> · 选题工具 Demo<br/>
    数据仅供选题参考，非实时接口；把 <b>data.js</b> 里的 TOPICS 换成你自己的数据源即可上线使用。
  </footer>
</div>

<script src="data.js"></script>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const listEl = $('#list'), chipsEl = $('#platformChips'), statsEl = $('#stats');
  const catEl = $('#catFilter'), sortEl = $('#sortBy'), searchEl = $('#search');

  let curPlatform = '全部';
  let openId = null;

  // 平台 chips
  const platforms = ['全部', ...Object.keys(PLATFORMS)];
  platforms.forEach(p=>{
    const c = document.createElement('div');
    c.className = 'chip' + (p==='全部'?' on':'');
    c.textContent = p;
    c.onclick = ()=>{ curPlatform = p;
      [...chipsEl.children].forEach(x=>x.classList.remove('on'));
      c.classList.add('on'); render(); };
    chipsEl.appendChild(c);
  });

  // 分类下拉
  Object.keys(CATEGORIES).forEach(c=>{
    const o = document.createElement('option'); o.value=c; o.textContent=c; catEl.appendChild(o);
  });
  catEl.onchange = render;
  sortEl.onchange = render;
  searchEl.oninput = render;

  function fmtHeat(h){
    if(h>=100) return (h/100).toFixed(2)+'亿';
    return h+'万';
  }

  function render(){
    const kw = searchEl.value.trim().toLowerCase();
    const cat = catEl.value;
    const sort = sortEl.value;

    let data = TOPICS.filter(t=>{
      if(curPlatform!=='全部' && t.p!==curPlatform) return false;
      if(cat && t.c!==cat) return false;
      if(kw && !(t.t.toLowerCase().includes(kw) || (t.a||'').toLowerCase().includes(kw))) return false;
      return true;
    });

    data.sort((a,b)=>{
      if(sort==='growth') return b.g - a.g;
      if(sort==='heat') return b.h - a.h;
      return b.s - a.s;
    });

    listEl.innerHTML = '';
    if(data.length===0){
      listEl.innerHTML = '<div class="empty">没有匹配的选题，换个关键词或分类试试～</div>';
    }

    data.forEach((t,i)=>{
      const rank = i+1;
      const pInfo = PLATFORMS[t.p] || {color:'#888',short:'?'};
      const cColor = CATEGORIES[t.c] || '#888';
      const gUp = t.g>=0;
      const rankCls = rank===1?'g1':rank===2?'g2':rank===3?'g3':'';
      const trendMap = {hot:'爆',rising:'飙升',new:'新'};
      const trendHtml = t.tr ? `<span class="trend ${t.tr}">${trendMap[t.tr]||''}</span>` : '';

      const item = document.createElement('div');
      item.className = 'item' + (openId===t.p+t.t?' open':'');
      item.innerHTML = `
        <div class="top">
          <div class="rank ${rankCls}">${rank}</div>
          <div class="main">
            <div class="ttl">${t.t}</div>
            <div class="meta">
              <span class="badge" style="background:${pInfo.color}">${t.p}</span>
              <span class="ctag" style="color:${cColor};border-color:${cColor}55">${t.c}</span>
              ${trendHtml}
            </div>
          </div>
          <div class="right">
            <div class="heat"><span class="ic">🔥</span>${fmtHeat(t.h)}</div>
            <div class="grow ${gUp?'up':'down'}">${gUp?'▲':'▼'} ${Math.abs(t.g)}%</div>
            <span class="arrow">▾</span>
          </div>
        </div>
        <div class="detail"><div class="detail-in">
          <div class="dl">💡 自媒体选题角度</div>
          <div class="angle">${t.a||'—'}</div>
          <button class="copy" data-angle="${encodeURIComponent(t.a||'')}">📋 复制标题模板</button>
        </div></div>`;

      item.querySelector('.top').onclick = ()=>{
        openId = (openId===t.p+t.t) ? null : t.p+t.t;
        item.classList.toggle('open');
      };

      const copyBtn = item.querySelector('.copy');
      copyBtn.onclick = (e)=>{
        e.stopPropagation();
        const txt = decodeURIComponent(copyBtn.dataset.angle);
        navigator.clipboard.writeText(txt).then(()=>{
          copyBtn.classList.add('done'); copyBtn.textContent='✓ 已复制';
          setTimeout(()=>{copyBtn.classList.remove('done');copyBtn.textContent='📋 复制标题模板';},1600);
        }).catch(()=>{ alert('复制失败，请手动选择：\n'+txt); });
      };

      listEl.appendChild(item);
    });

    renderStats();
  }

  function renderStats(){
    const total = TOPICS.length;
    const plats = Object.keys(PLATFORMS).length;
    const rising = TOPICS.filter(t=>t.tr==='hot'||t.tr==='rising').length;
    const avg = Math.round(TOPICS.reduce((s,t)=>s+t.s,0)/total);
    const cards = [
      {n:total, l:'收录选题', u:'条'},
      {n:plats, l:'覆盖平台', u:'个'},
      {n:rising, l:'今日爆/飙升', u:'条'},
      {n:avg, l:'平均热度指数', u:''},
    ];
    statsEl.innerHTML = cards.map(c=>
      `<div class="stat"><div class="n">${c.n}<span class="u">${c.u}</span></div><div class="l">${c.l}</div></div>`
    ).join('');
  }

  render();
})();
</script>
</body>
</html>
